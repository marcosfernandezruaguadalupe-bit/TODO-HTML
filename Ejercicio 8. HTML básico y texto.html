	    <p>
		"Si, repite las hormigas,<br> 
		he visto las estrellas,<br>
		subi al arbol mas alto <br>
		que tiene la almeda <br>
		y vi miles de ojos<br>
		dentro de mis tinieblas."<br>
		</p>
		
		<p>Extracto del poema <b><cite>Los encuentros de un caracol aventurero</b></cite>, de Federico Garcia Lorca</p>
